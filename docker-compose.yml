version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: heritageguardian-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./heritageguardian.db
      - GRANITE_API_KEY=${GRANITE_API_KEY:-}
      - IBM_CLOUD_API_KEY=${IBM_CLOUD_API_KEY:-}
      - IBM_PROJECT_ID=${IBM_PROJECT_ID:-}
      - UPLOAD_DIR=/app/uploads
      - REPORTS_DIR=/app/reports
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: heritageguardian-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: heritageguardian-network
