version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heritage-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=demo
      - DATABASE_URL=sqlite:///./heritage.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      # Uncomment and set for IBM Granite:
      # - IBM_API_KEY=your-ibm-cloud-api-key
      # - GRANITE_ENDPOINT=https://us-south.ml.cloud.ibm.com
      # - WATSONX_PROJECT_ID=your-watsonx-project-id
      # - GRANITE_MODEL=ibm/granite-3-3-8b-instruct
    volumes:
      - heritage_data:/app/heritage.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: heritage-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  heritage_data:
